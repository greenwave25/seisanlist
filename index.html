<style>
:root{--bg:#000;--fg:#f2f2f2;--sub:#9a9a9a;--line:#2a2a2a;--row:#1c2a3a;--done:#0c0c0c;--acc:#f5c542;--ok:#3ecf8e;--ng:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
header{padding:12px 16px;font-size:18px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
header small{font-size:13px;font-weight:400;color:var(--sub)}
#list{flex:1;overflow-y:auto;padding:10px 12px 90px}
.empty{text-align:center;color:var(--sub);margin-top:30vh}
.row{border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--row);border-left:5px solid var(--ng)}
.row.done{background:var(--done);border-left-color:var(--ok);color:#999}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.name{font-size:17px;font-weight:600;margin:4px 0 2px}
.item{font-size:14px;margin-bottom:6px}
.mid{display:flex;justify-content:space-between;align-items:center}
.amt{font-size:20px;font-weight:700}
.tag{font-size:12px;border:1px solid var(--sub);border-radius:20px;padding:1px 8px;margin-left:6px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:14px;touch-action:manipulation}
.btns .on.n{background:var(--ng);color:#000;border-color:var(--ng);font-weight:700}
.btns .on.d{background:var(--ok);color:#000;border-color:var(--ok);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;background:linear-gradient(transparent,#000 40%)}
.fab{background:var(--acc);color:#000;border:0;border-radius:30px;padding:12px 28px;font-size:16px;font-weight:700}
#edit{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#edit.show{display:flex}
.bar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:#161616;color:var(--fg);font-size:14px}
.bar .ok{background:var(--acc);color:#000;font-weight:700;border-color:var(--acc)}
.bar .del{color:var(--ng)}
form,.form{flex:1;overflow-y:auto;padding:12px 16px 40px}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:11px;font-size:16px;background:#141414;color:var(--fg);border:1px solid var(--line);border-radius:8px;-webkit-user-select:text;user-select:text}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{padding:9px 14px;border:1px solid var(--line);border-radius:20px;font-size:15px;background:#141414}
.seg input{display:none}
.seg input:checked+span{color:var(--acc);font-weight:700}
.seg label:has(input:checked){border-color:var(--acc)}
.part{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.part input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
nav{gap:12px;align-items:center}
.gear{background:#1c1c1c;color:var(--fg);border:1px solid var(--line);border-radius:30px;padding:12px 18px;font-size:15px}
.band{border-radius:12px;padding:8px 8px 1px;margin-bottom:14px}
.b1{background:#c4b25a}.b0{background:#b0b0b0}
.bh{color:#111;font-weight:700;font-size:14px;padding:2px 4px 8px}
#set{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#set.show{display:flex}
.sbtn{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:1px solid var(--line);background:#161616;color:var(--fg);font-size:15px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
#load{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9}
#load.show{display:flex}
.pg{width:60%;height:6px;background:#333;border-radius:3px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.row{position:relative}
.stamp{position:absolute;right:14px;top:30px;width:54px;height:54px;border:3px double #e0443e;border-radius:50%;color:#e0443e;font-size:30px;font-weight:700;line-height:48px;text-align:center;transform:rotate(-14deg);opacity:.9;pointer-events:none}
.row.done .name,.row.done .item{padding-right:66px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
label.f{margin:8px 0 3px}
input[type=text],input[type=number],input[type=date]{padding:8px 10px;height:40px;min-width:0;-webkit-appearance:none;appearance:none}
.seg{flex-wrap:nowrap;gap:6px}
.seg label{flex:1;text-align:center;padding:8px 2px;font-size:14px;white-space:nowrap}
.part{margin-top:8px}
.form{padding:4px 16px 16px}
header{padding:8px 16px;font-size:17px}

.bd.n{color:#9b1c1c}.bd.d{color:#14532d}
.row{padding:6px 10px;margin-bottom:6px;border-radius:8px}
.top{font-size:12px}
.name{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:1px 0 0}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:17px;font-weight:700;margin-left:8px;white-space:nowrap}
.item{font-size:13px;margin-bottom:0}
.btns{margin-top:5px;gap:6px}
.btns button{padding:6px 0;font-size:13px}
.row.done .name,.row.done .item{padding-right:0}
.row.done .nm{margin-right:64px}
.stamp{right:96px;top:14px;width:42px;height:42px;font-size:23px;line-height:36px}
.bh{cursor:pointer}
.band.c{padding-bottom:6px}.band.c .bh{padding-bottom:0}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#dlg.show{display:flex}
.dbox{background:#1c1c1c;border:1px solid var(--line);border-radius:12px;padding:18px;width:80%;max-width:320px}
#dm{margin-bottom:14px;font-size:15px}
.dbtn{display:flex;gap:8px}
.dbtn button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#161616;color:var(--fg);font-size:15px}
#dy{background:var(--acc);color:#000;font-weight:700}
nav{position:static;flex:none;height:78px;padding:0;gap:36px;border-top:1px solid var(--line);background:#000}
.sp{min-width:64px}
#list{padding:8px 10px 10px}
.ib{min-width:64px;height:60px;border-radius:14px;border:none;background:none;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6px;font-family:inherit}
.ib:not(.big)::after{content:attr(aria-label);font-size:11px}
.ib:active{background:#222}
.ib svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.big svg{width:46px;height:46px}
.row{border-left:none}
.tag{font-size:13px;font-weight:700;color:var(--acc);border:1.5px solid var(--acc);padding:0 8px}
.btns button{padding:7px 0;font-size:14px;font-weight:600;color:#d0d0d0;background:linear-gradient(#444449,#2a2a2e);border:1px solid #5a5a60;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.15)}
.btns button:active{transform:translateY(1px);box-shadow:0 1px 0 #000}
.btns .on.n{color:#fff;background:linear-gradient(#f06a6e,#d63a3f);border-color:#ff9a9d}

.shead{padding:10px;font-size:16px;color:var(--sub);text-align:center}

header{background:#000;color:#f2f2f2;font-size:19px;border-bottom:1px solid var(--line)}
#sync{font-size:13px;color:var(--sub);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.smv{font-size:19px;font-weight:700;line-height:1.2;white-space:nowrap}
.pbox{border:1px solid var(--line);border-radius:8px;background:#161616;padding:14px 16px;margin-top:10px}

.sw{position:relative;display:inline-block;width:52px;height:30px;flex:none}

.sw .knob{position:absolute;inset:0;background:#3a3a3e;border-radius:15px;transition:.2s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.knob{background:var(--ok)}
.sw input:checked+.knob::after{transform:translateX(22px)}
label.fh small{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
#disp{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
#disp.show{display:flex}
#disp .form{order:1}
#disp .bar{order:2;border-top:1px solid var(--line);border-bottom:none}
:root{--e:0px;--g:calc(var(--e)/6)}
.row{padding:calc(6px + var(--g)) 10px}
.name{margin-top:calc(1px + var(--g))}
.item{margin-top:var(--g)}
.btns{margin-top:calc(5px + var(--g))}
.btns button{padding:calc(7px + var(--g)/2) 0}
#init{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
#init.show{display:flex}
#init .form{order:1}
#init .bar{order:2;border-top:1px solid var(--line);border-bottom:none}
.initbtn{padding:16px 18px;margin-top:6px}
.initbtn.warn{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.itl{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;margin-bottom:10px}
.chev{color:var(--sub);font-size:24px;font-weight:400}

.sgb:active{transform:translateY(1px);box-shadow:0 1px 0 #000}
.sgi{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #333;color:var(--fg);font-family:inherit}

<script>
const PAYS=["d払い","ID","dカード","現金","その他"],KEY="seisan:v1";
let data=[],cur=null,dirty=false;
let closing=0,savedAt=0,purgeOn=true,purgeMonths=15;
try{const s0=JSON.parse(localStorage.getItem("seisan:v2")||"null");
 if(s0){data=s0.items||[];closing=s0.closing||0;savedAt=s0.savedAt||0;readPurge(s0)}else data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const $=id=>document.getElementById(id);
const pack=()=>({v:1,savedAt,closing,items:data,purge:{on:purgeOn,months:purgeMonths}});
function readPurge(o){if(o&&o.purge){purgeOn=o.purge.on!==false;const m=parseInt(o.purge.months,10);purgeMonths=m>=13?m:15}}
function purgeOld(){
  if(!purgeOn)return 0;
  const t=new Date(),c=new Date(t.getFullYear(),t.getMonth()-purgeMonths,1),last=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();
  c.setDate(Math.min(t.getDate(),last));
  const cs=c.getFullYear()+"-"+String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");
  const keep=data.filter(x=>!(x.done&&x.date<=cs)),n=data.length-keep.length;
  if(n>0){data=keep;save();ls("seisan:note",String((+ls("seisan:note")||0)+n))}
  return n}
function showNote(){const n=+ls("seisan:note")||0;if(n>0){ls("seisan:note",null);toast("精算済みデータを"+n+"件削除しました",4500,true)}}
function tryNote(d){setTimeout(()=>{if($("load").classList.contains("show")){tryNote(500);return}showNote()},d)}
const localSave=()=>{try{localStorage.setItem("seisan:v2",JSON.stringify(pack()))}catch(e){}};
const save=()=>{savedAt=Date.now();localSave();sched()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(t,ms,mid){const e=$("toast");e.textContent=t;e.classList.toggle("mid",!!mid);e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),ms||1400)}
function render(){
  const kk=x=>{const p=per(x.date);return p?p.k:0};const sgn=x=>gs[kk(x)]==="d"?-1:1;const L=[...data].sort((a,b)=>(kk(b)-kk(a))||sgn(a)*(a.date.localeCompare(b.date)||a.id-b.id));
  const un=data.filter(x=>!x.done).reduce((s,x)=>s+x.amt,0);
  $("smv").textContent=un.toLocaleString()+"円";
  $("list").innerHTML=L.length?bandHtml(L,x=>`<div class="row ${x.done?"done":""}" data-id="${x.id}">${x.done?'<div class="stamp">済</div>':""}
    <div class="top"><span>${esc(x.date.replace(/-/g,"/"))}(${"日月火水木金土"[new Date(x.date+"T00:00:00").getDay()]})</span><span>${esc(x.pay)}${x.part?'<span class="tag">一部支払</span>':""}</span></div>
    <div class="name"><span class="nm">${esc(x.shop||"（店舗名なし）")}</span><span class="amt">${x.amt.toLocaleString()}円</span></div><div class="item">${esc(x.item)}</div>
    
    <div class="btns"><button class="n ${x.done?"":"on"}" data-s="0">未精算</button><button class="d ${x.done?"on":""}" data-s="1">精算済み</button></div>
  </div>`):'<div class="empty">登録がありません<br>「新規登録」から追加できます</div>';
}
function radios(el,name,opts,val){el.innerHTML=opts.map(([v,t])=>`<label><input type="radio" name="${name}" value="${v}" ${v==val?"checked":""}><span>${t}</span></label>`).join("");
  el.onchange=()=>dirty=true}
function open_(x){
  cur=x?x.id:null;dirty=false;document.querySelectorAll(".sgl").forEach(b=>{b.style.display="none"});
  $("date").value=x?x.date:today();$("shop").value=x?x.shop:"";$("item").value=x?x.item:"";
  $("amt").value=x?x.amt:"";$("part").checked=!!(x&&x.part);
  radios($("pay"),"pay",PAYS.map(p=>[p,p]),x?x.pay:"d払い");
  radios($("st"),"st",[["0","未精算"],["1","精算済み"]],x&&x.done?"1":"0");
  $("del").style.display=x?"":"none";$("edit").classList.add("show");
}
document.querySelectorAll("#date,#shop,#item,#amt,#part").forEach(e=>e.addEventListener("input",()=>dirty=true));
$("add").onclick=()=>open_(null);
$("back").onclick=async()=>{if(dirty&&!await ask("編集内容を破棄して戻りますか？"))return;$("edit").classList.remove("show")};
$("del").onclick=async()=>{if(await ask("この精算を削除しますか？")){data=data.filter(x=>x.id!==cur);save();render();$("edit").classList.remove("show")}};
$("save").onclick=()=>{
  const amt=parseInt($("amt").value,10);
  if(!$("date").value){toast("支払日を入力してください");return}
  if(isNaN(amt)){toast("金額を入力してください");return}
  const o={date:$("date").value,shop:$("shop").value.trim(),item:$("item").value.trim(),amt,
    pay:document.querySelector('input[name=pay]:checked').value,part:$("part").checked,
    done:document.querySelector('input[name=st]:checked').value==="1"};
  if(cur){Object.assign(data.find(x=>x.id===cur),o)}else{data.push({id:Date.now(),...o})}
  {const pp=per(o.date);if(pp&&!o.done)fold.delete(pp.k)}
  save();render();$("edit").classList.remove("show");
};

function per(ds){
  const C=closing;if(!C)return null;
  const [y,m,d]=ds.split("-").map(Number),eff=(yy,mm)=>Math.min(C,new Date(yy,mm,0).getDate());
  let cy=y,cm=m;if(d>eff(y,m)){cm++;if(cm>12){cm=1;cy++}}
  let py=cy,pm=cm-1;if(pm<1){pm=12;py--}
  const st=new Date(py,pm-1,eff(py,pm)+1),sm=st.getMonth()+1;
  return {k:st.getFullYear()*12+sm,label:st.getFullYear()+"年"+sm+"月分"};
}

  for(const x of L){const p=per(x.date),key=""+p.k;
    if(key!==last){flush();cur={k:p.k,label:p.label,h:"",u:0,s:0,t:0};last=key}

  flush();return out;
}

  cbk=r=>{

async function gf(url,opt){
