<script>
const PAYS=["d払い","ID","dカード","現金","その他"],KEY="seisan:v1";
let data=[],cur=null,dirty=false;
let closing=0,savedAt=0;
try{const s0=JSON.parse(localStorage.getItem("seisan:v2")||"null");
 if(s0){data=s0.items||[];closing=s0.closing||0;savedAt=s0.savedAt||0}else data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const $=id=>document.getElementById(id);
const localSave=()=>{try{localStorage.setItem("seisan:v2",JSON.stringify({v:1,savedAt,closing,items:data}))}catch(e){}};
const save=()=>{savedAt=Date.now();localSave();sched()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1400)}
function render(){
  const kk=x=>{const p=per(x.date);return p?p.k:0};const sgn=x=>gs[kk(x)]==="d"?-1:1;const L=[...data].sort((a,b)=>(kk(b)-kk(a))||sgn(a)*(a.date.localeCompare(b.date)||a.id-b.id));
  const un=data.filter(x=>!x.done).reduce((s,x)=>s+x.amt,0);
  $("sum").textContent=data.length?"未精算合計 "+un.toLocaleString()+"円":"";
  $("list").innerHTML=L.length?bandHtml(L,x=>`<div class="row ${x.done?"done":""}" data-id="${x.id}">${x.done?'<div class="stamp">済</div>':""}
    <div class="top"><span>${esc(x.date.replace(/-/g,"/"))}(${"日月火水木金土"[new Date(x.date+"T00:00:00").getDay()]})</span><span>${esc(x.pay)}${x.part?'<span class="tag">一部支払</span>':""}</span></div>
    <div class="name"><span class="nm">${esc(x.shop||"（店舗名なし）")}</span><span class="amt">${x.amt.toLocaleString()}円</span></div><div class="item">${esc(x.item)}</div>
    
    <div class="btns"><button class="n ${x.done?"":"on"}" data-s="0">未精算</button><button class="d ${x.done?"on":""}" data-s="1">精算済み</button></div>

function per(ds){
  const C=closing;if(!C)return null;
  const [y,m,d]=ds.split("-").map(Number),eff=(yy,mm)=>Math.min(C,new Date(yy,mm,0).getDate());
  let cy=y,cm=m;if(d>eff(y,m)){cm++;if(cm>12){cm=1;cy++}}
  let py=cy,pm=cm-1;if(pm<1){pm=12;py--}
  const st=new Date(py,pm-1,eff(py,pm)+1),sm=st.getMonth()+1;
  return {k:st.getFullYear()*12+sm,label:st.getFullYear()+"年"+sm+"月分"};
}
function bandHtml(L,f){

  for(const x of L){const p=per(x.date),key=""+p.k;
    if(key!==last){flush();cur={k:p.k,label:p.label,h:"",u:0,s:0,t:0};last=key}
    cur.h+=f(x);cur.t+=x.amt;if(!x.done){cur.u++;cur.s+=x.amt}}
  flush();return out;
}
